function renderAdmin() {
  app.innerHTML = `<section class="panel">
    <h1>ورود به پنل مدیریت</h1>
    <p class="muted">برای مشاهده شمارنده، رمز عبور را وارد کنید.</p>
    <form id="login"><input id="pw" type="password" placeholder="رمز مدیریت" required autocomplete="current-password">
    <button type="submit">ورود به پنل</button><p class="error" id="err" aria-live="polite"></p></form>
  </section>`;
  document.getElementById("login").addEventListener("submit", e => {
    e.preventDefault();
    if (document.getElementById("pw").value !== PASSWORD) {
      document.getElementById("err").textContent = "رمز عبور اشتباه است.";
      return;
    }
    const count = Number(localStorage.getItem(VIEW_KEY) || "0");
    app.innerHTML = `<section class="panel">
      <h1>داشبورد آمار نامه</h1><p class="muted">شمارنده ذخیره‌شده در همین مرورگر</p>
      <div class="stat"><div class="label">تعداد بازشدن صفحه در این مرورگر</div><div class="num">${count.toLocaleString("fa-IR")}</div></div>
      <div class="notice">این آمار فقط روی همین مرورگر و دستگاه ذخیره می‌شود و تعداد واقعی همه بازدیدکنندگان نیست. رمز ورود نیز داخل کد HTML قابل مشاهده است؛ برای امنیت واقعی و آمار سراسری به سرویس سمت سرور نیاز است.</div>
      <a href="/">بازگشت به نامه</a>
    </section>`;
  });
}

if (isAdmin) renderAdmin(); else renderLetter();
